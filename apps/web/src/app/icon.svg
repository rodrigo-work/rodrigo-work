<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect class="theme-icon-back" width="256" height="256" rx="32" ry="32" fill="currentColor" stroke="currentColor" />
  <circle
    className="theme-icon-circle"
    cx="192"
    cy="192"
    fill="currentColor"
    r="32"
    stroke="none"
    stroke-width="32"
  />
  <line
    class="theme-icon-line"
    x1="208"
    y1="50"
    x2="50"
    y2="208"
    fill="currentColor"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="32"
  />
  <style>
    .theme-icon-back {
      color: white;
    }
    .theme-icon-line {
      color: black;
    }
    .theme-icon-circle {
      color: black;
    }

    @media (prefers-color-scheme: dark) {
      .theme-icon-back {
        color: black;
      }
      .theme-icon-line {
        color: white;
      }
      .theme-icon-circle {
        color: white;
      }
    }
  </style>
</svg>
